name: Check

# Pull requests (and manual runs):
# - Linux: builds the bridge with mingw-w64 and the Linux CLAP with gcc, runs the bridge tests under Wine
#   (bridge/test/run_tests.sh: both Windows directions, the Linux CLAP with a 32-bit and a 64-bit plugin, the macOS
#   variant of the CLAP built on Linux, and the Linux CLAP again with ASan + UBSan) and checks the patcher from source (syntax, --selftest, --cli as the Windows
#   and as the Linux patcher).
# - macOS: builds the universal CLAP, freezes the patcher like the release (--selftest must see arm64 + x86_64), lets
#   it write a .clap bundle, verifies the signature and loads the bundle (without Wine: entry and factory only).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# a new push to a pull request cancels the run of the previous commit
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: CI image
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  check:
    name: Bridge tests (Wine) and patcher
    needs: image
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --shm-size=1g
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Bridge tests
        timeout-minutes: 10
        run: bash bridge/test/run_tests.sh

      - name: Patcher
        run: |
          set -euo pipefail
          python3 -m py_compile patcher.py patcher_i18n.py utility/*.py
          python3 patcher.py --selftest
          VB_TEST_SYSTEM=windows python3 patcher.py --selftest
          T="$(mktemp -d)"; mkdir -p "$T/Input/sub"
          i686-w64-mingw32-gcc -O2 -Ibridge -shared -o "$T/Input/plug32.dll" bridge/test/fakevst.c -static-libgcc -s
          x86_64-w64-mingw32-gcc -O2 -Ibridge -shared -o "$T/Input/sub/plug64.dll" bridge/test/fakevst.c -static-libgcc -s
          mkdir -p fake && cp "$T/Input/plug32.dll" fake/        # for the macOS job
          cp -r "$T/Input" "$T/Win"
          echo "== as the Windows patcher (bridges next to the plugins, the plugins stay)"
          VB_TEST_SYSTEM=windows python3 patcher.py --cli "$T/Win"
          test -f "$T/Win/plug32.dll" && test -f "$T/Win/plug32_x64.dll" && test -f "$T/Win/plug32_x64.clap" && test -f "$T/Win/vst2bridge-host32.exe"
          test -f "$T/Win/sub/plug64.dll" && test -f "$T/Win/sub/plug64_x86.dll" && test -f "$T/Win/sub/plug64_x86.clap" && test -f "$T/Win/sub/vst2bridge-host64.exe"
          cmp "$T/Input/plug32.dll" "$T/Win/plug32.dll" && cmp "$T/Input/sub/plug64.dll" "$T/Win/sub/plug64.dll"      # originals unchanged
          VB_TEST_SYSTEM=windows python3 patcher.py --cli "$T/Win" | grep -c current | grep -qx 2
          echo "== Windows output formats"
          cp -r "$T/Input" "$T/Win2"
          VB_TEST_SYSTEM=windows python3 patcher.py --cli "$T/Win2" --format vst2
          test -f "$T/Win2/plug32_x64.dll" && test ! -e "$T/Win2/plug32_x64.clap"
          cp -r "$T/Input" "$T/Win3"
          VB_TEST_SYSTEM=windows python3 patcher.py --cli "$T/Win3" --format clap
          test -f "$T/Win3/plug32_x64.clap" && test ! -e "$T/Win3/plug32_x64.dll"
          echo "== as the Linux patcher (CLAP only)"
          python3 patcher.py --cli "$T/Input"
          test -f "$T/Input/plug32.dll" && test -f "$T/Input/plug32.clap" && test -f "$T/Input/vst2bridge-host32.exe" && test ! -e "$T/Input/plug32_x64.dll"
          test -f "$T/Input/sub/plug64.clap" && test -f "$T/Input/sub/vst2bridge-host64.exe"
          python3 patcher.py --cli "$T/Input" | grep -c current | grep -qx 2
          echo "== the patcher's own folder as a source (top level only)"
          mkdir -p "$T/Root/sub"
          cp fake/plug32.dll "$T/Root/"; cp "$T/Input/sub/plug64.dll" "$T/Root/sub/"
          cp "$T/Input/plug32.clap" "$T/Input/vst2bridge-host32.exe" "$T/Root/"
          python3 -I - "$T/Root" <<'PY'
          import sys; sys.path.insert(0, 'utility'); from pathlib import Path; import bridges
          root = Path(sys.argv[1])
          names = [p.path.name for p in bridges.scan([], Path('bridge'), flat = [root])]
          assert names == ['plug32.dll'], names     # plug64.dll sits in a subfolder, the .clap / helper are no plugins
          PY

      - name: Stop Wine
        if: always()
        run: wineserver -k || true          # leftover Wine processes make the job hang in its cleanup

      - name: Upload helpers and test plugin (macOS job)
        uses: actions/upload-artifact@v7
        with:
          name: check-bin
          path: |
            bridge/vst2bridge-host32.exe
            bridge/vst2bridge-host64.exe
            fake/plug32.dll
          if-no-files-found: error

  macos:
    name: macOS CLAP and patcher
    needs: check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download helpers and test plugin
        uses: actions/download-artifact@v8
        with:
          name: check-bin
          path: dl

      - name: Build
        run: |
          set -euo pipefail
          make -C bridge macos
          lipo -info bridge/vst2bridge-macos
          clang -O2 -Wall -Ibridge -o smoke bridge/test/smoke.c

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Freeze the patcher like the release, self test, write a bundle and load it
        run: |
          set -euo pipefail
          mkdir bin
          cp dl/bridge/vst2bridge-host32.exe dl/bridge/vst2bridge-host64.exe bin/
          gzip -9 -c bridge/vst2bridge-macos > bin/vst2bridge-macos.gz   # gzipped: PyInstaller would thin a bare Mach-O file
          python -m pip install --quiet pyinstaller
          python -m PyInstaller --onefile --windowed --noconfirm --clean --name VST2Bridge-Patcher \
            --icon utility/icons/patcher.icns --add-data "utility/icons:icons" \
            --paths utility --paths . --add-data "bin:bin" --add-data "docs/versions.md:docs" \
            --hidden-import patcher_i18n --hidden-import bridges --hidden-import pe --hidden-import selfupdate patcher.py
          P=dist/VST2Bridge-Patcher.app/Contents/MacOS/VST2Bridge-Patcher
          "$P" --selftest
          mkdir -p t && cp dl/fake/plug32.dll t/
          "$P" --cli "$PWD/t"
          find t
          cmp t/plug32.dll dl/fake/plug32.dll                   # the plugin stays where it is, unchanged
          codesign --verify --verbose t/plug32.clap
          ./smoke t/plug32.clap/Contents/MacOS/plug32 "$PWD/t/plug32.clap"
          ./smoke t/plug32.clap/Contents/MacOS/plug32
          "$P" --cli "$PWD/t" | grep -q current
