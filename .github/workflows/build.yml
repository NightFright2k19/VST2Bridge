name: Autobuild

# Every push to main that touches the bridge or the patcher makes a release autobuild-r<N> with the patchers
# (patcher.py frozen with PyInstaller, each with the bridge files of its system and docs/versions.md):
#   VST2Bridge-Patcher-r<N>-windows.exe              the six Windows bridge files (mingw-w64, `bridge` job)
#   VST2Bridge-Patcher-r<N>-linux.tar.gz             vst2bridge-linux.clap (built on ubuntu-22.04 for an old glibc) + the two helpers
#   VST2Bridge-Patcher-r<N>-macos-applesilicon.zip   vst2bridge-macos (universal, gzipped) + the two helpers
#   VST2Bridge-Patcher-r<N>-macos-intel.zip          the same, frozen on an Intel runner
#   VST2Bridge-DevKit-r<N>.zip                       x86_host / x64_host: bridge DLL + helper for hosts with direct loading (not used by selfupdate.py)
# The tag and the asset names are a contract with utility/selfupdate.py: change them together.

on:
  push:
    branches: [main]
    paths:
      - 'patcher*.py'
      - 'utility/**'
      - 'bridge/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vst2bridge-autobuild
  cancel-in-progress: false

jobs:
  bridge:
    name: Bridge (mingw-w64, Wine tests incl. the Linux CLAP)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install tools
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # no recommends: they pull in hundreds of MB (fonts, GStreamer ...) the tests do not need
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-mingw-w64 libxcb1-dev wine wine64 wine32:i386 xvfb xauth

      - name: Initialise Wine
        timeout-minutes: 5
        run: xvfb-run -a wine wineboot -i

      - name: Build and test
        timeout-minutes: 10
        run: |
          set -euo pipefail
          bash bridge/test/run_tests.sh
          mkdir bin
          cp bridge/vst2bridge-x64.dll bridge/vst2bridge-x86.dll bridge/vst2bridge-x64.clap bridge/vst2bridge-x86.clap bridge/vst2bridge-host32.exe bridge/vst2bridge-host64.exe bin/
          file bin/*

      - name: Stop Wine
        if: always()
        run: wineserver -k || true          # leftover Wine processes make the job hang in its cleanup

      - name: Upload bridge
        uses: actions/upload-artifact@v7
        with:
          name: bridge-bin
          path: bin/*
          if-no-files-found: error

  version:
    name: Determine release number
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.version.outputs.revision }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Next release number
        id: version
        uses: actions/github-script@v8
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            let max = 0;
            for (const r of releases) {
              const m = r.tag_name.match(/^autobuild-r(\d+)$/);
              if (m) max = Math.max(max, parseInt(m[1], 10));
            }
            core.setOutput('revision', max + 1);
            core.setOutput('tag', `autobuild-r${max + 1}`);
            console.log(`Next autobuild: r${max + 1}`);

  build:
    name: Patcher ${{ matrix.label }}
    needs: [version, bridge]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, label: Windows,             asset: windows }
          - { os: ubuntu-22.04,   label: Linux,               asset: linux }
          - { os: macos-15,       label: macOS Apple Silicon, asset: macos-applesilicon }
          - { os: macos-15-intel, label: macOS Intel,         asset: macos-intel }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download bridge
        uses: actions/download-artifact@v8
        with:
          name: bridge-bin
          path: bin

      - name: Linux CLAP (the Windows bridges are not part of the Linux patcher)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y libxcb1-dev
          make -C bridge linux
          cp bridge/vst2bridge-linux.clap bin/
          rm -f bin/*.dll bin/vst2bridge-x64.clap bin/vst2bridge-x86.clap
          file bin/*

      - name: macOS CLAP (the Windows bridges are not part of the macOS patcher)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          make -C bridge macos
          lipo -info bridge/vst2bridge-macos
          gzip -9 -c bridge/vst2bridge-macos > bin/vst2bridge-macos.gz   # gzipped: PyInstaller would thin a bare Mach-O file to the runner's architecture
          rm -f bin/*.dll bin/vst2bridge-x64.clap bin/vst2bridge-x86.clap
          ls -la bin

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller certifi

      - name: Build patcher
        env:
          REVISION: r${{ needs.version.outputs.revision }}
        run: |
          set -euo pipefail
          echo "VERSION = '$REVISION'" > patcher_version.py
          case "${{ runner.os }}" in                  # program icon: .ico (Windows), .icns (macOS); Linux has none
            Windows) ICON="--icon utility/icons/patcher.ico" ;;
            macOS)   ICON="--icon utility/icons/patcher.icns" ;;
            *)       ICON="" ;;
          esac
          python -m PyInstaller --onefile --windowed --noconfirm --clean $ICON \
            --name VST2Bridge-Patcher \
            --paths utility --paths . \
            --add-data "bin:bin" \
            --add-data "utility/icons:icons" \
            --add-data "docs/versions.md:docs" \
            --hidden-import patcher_i18n --hidden-import patcher_version --hidden-import certifi \
            --hidden-import bridges --hidden-import pe --hidden-import selfupdate \
            patcher.py
          ls -la dist

      - name: Self test and package
        env:
          NAME: VST2Bridge-Patcher-r${{ needs.version.outputs.revision }}-${{ matrix.asset }}
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Windows) EXE=dist/VST2Bridge-Patcher.exe ;;
            Linux)   EXE=dist/VST2Bridge-Patcher ;;
            macOS)   EXE=dist/VST2Bridge-Patcher.app/Contents/MacOS/VST2Bridge-Patcher ;;
          esac
          "$EXE" --selftest --selftest-out selftest.txt
          cat selftest.txt
          grep -q "r${{ needs.version.outputs.revision }}" selftest.txt
          mkdir upload
          case "${{ runner.os }}" in
            Windows) cp dist/VST2Bridge-Patcher.exe "upload/$NAME.exe" ;;
            Linux)   tar -C dist -czf "upload/$NAME.tar.gz" VST2Bridge-Patcher ;;
            macOS)   ditto -c -k --keepParent dist/VST2Bridge-Patcher.app "upload/$NAME.zip" ;;
          esac
          ls -la upload

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: patcher-${{ matrix.asset }}
          path: upload/*
          if-no-files-found: error

  release:
    name: Create release
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download patchers
        uses: actions/download-artifact@v8
        with:
          pattern: patcher-*
          path: assets
          merge-multiple: true

      - name: Download bridge files
        uses: actions/download-artifact@v8
        with:
          name: bridge-bin
          path: bridge-bin

      - name: Pack developer kit
        env:
          NAME: VST2Bridge-DevKit-r${{ needs.version.outputs.revision }}
        run: |
          set -euo pipefail
          mkdir -p kit/x86_host kit/x64_host
          cp bridge-bin/vst2bridge-x86.dll bridge-bin/vst2bridge-host64.exe kit/x86_host/
          cp bridge-bin/vst2bridge-x64.dll bridge-bin/vst2bridge-host32.exe kit/x64_host/
          (cd kit && zip -r "../assets/$NAME.zip" x86_host x64_host)

      - name: List assets
        run: ls -la assets

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.tag }}
          commit: ${{ github.sha }}
          name: Autobuild r${{ needs.version.outputs.revision }}
          prerelease: false
          makeLatest: true
          artifacts: assets/*
          artifactErrorsFailBuild: true
          body: |
            The **VST2Bridge Patcher** makes 32-bit VST2 plugins usable in 64-bit hosts and 64-bit plugins in 32-bit hosts. On Linux and macOS it makes Windows VST2 plugins (32-bit and 64-bit) usable as CLAP plugins, run under Wine. Free for everybody (LGPL-3.0).

            **DOWNLOAD**
            - Windows: `...-windows.exe`
            - Linux: `...-linux.tar.gz` (extract, then run `VST2Bridge-Patcher`)
            - macOS: `...-macos-applesilicon.zip` (M1 and newer) or `...-macos-intel.zip` (extract, then open the app)
            - Developers of Windows VST2 hosts: `VST2Bridge-DevKit-r<N>.zip` (the bridge DLLs and helpers for [direct loading](https://github.com/NightFright2k19/VST2Bridge/blob/main/docs/host-integration.md), no patcher)

            **INSTRUCTIONS**
            - Put the patcher into a folder together with your VST2 plugin DLLs (right next to it, no subfolders), or click **Add folder…** to search another folder (with its subfolders) as well. Untick the plugins you do not want.
            - Windows: pick the **Output format** (VST2 + CLAP, VST2 only or CLAP only).
            - Click **Create bridges**. For every plugin the patcher writes the bridge files and the helper exe into the folder the plugin lies in. The plugin itself is never moved, copied or changed (plugins that already have bridges are listed too and get new ones); the full set for a plugin is a VST2 bridge and a CLAP bridge:
              - 32-bit plugin `syxg50.dll` → `syxg50_x64.dll` + `syxg50_x64.clap` (for 64-bit hosts) + `vst2bridge-host32.exe`
              - 64-bit plugin `Emu-SC8850.dll` → `Emu-SC8850_x86.dll` + `Emu-SC8850_x86.clap` (for 32-bit hosts) + `vst2bridge-host64.exe`
            - Load the bridge in your host like any plugin (the `.dll` as VST2, the `.clap` as CLAP; let the CLAP host scan the plugin folder). Keep the plugin and the helper exe in the same folder as the bridge files (the patcher puts them next to the plugin); the `.clap` also works without the `_x64.dll` / `_x86.dll`, but finds its plugin by its own file name, so do not rename it.
            - **Linux and macOS:** the patcher writes only CLAP bridges: `syxg50.dll` → `syxg50.clap` (macOS: a `.clap` bundle, signed ad hoc) + the helper of the plugin's bitness (`vst2bridge-host32.exe` or `vst2bridge-host64.exe`). The CLAP runs the Windows plugin in that helper under **Wine**, which must be installed (`wine` in the path, a usual install folder on macOS, or `VB_WINE`). The plugin's window is embedded on Linux (X11) and opens as a floating window on macOS (Wine on Apple Silicon needs Rosetta 2). Linux and macOS are not tested in real hosts yet: feedback welcome.

            **WHAT'S NEW**
            - Windows VST2 hosts can [open plugins by path](https://github.com/NightFright2k19/VST2Bridge/blob/main/docs/host-integration.md) with `VST2BridgeCreateA/W`.
            - Developer kit for host authors: `VST2Bridge-DevKit-r<N>.zip` with `x86_host` (`vst2bridge-x86.dll` + `vst2bridge-host64.exe`) and `x64_host` (`vst2bridge-x64.dll` + `vst2bridge-host32.exe`).
            - See the [version history](https://github.com/NightFright2k19/VST2Bridge/blob/main/docs/versions.md); the patcher shows it with **What's new?**.

  history:
    name: Version history
    needs: [version, release]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Number the "next" rows in docs/versions.md
        env:
          REVISION: ${{ needs.version.outputs.revision }}
        run: |
          set -euo pipefail
          # Rows added since the last release are written as "| next | | ... |"; they get this release's number and date.
          if grep -q '^| next | |' docs/versions.md; then
            sed -i "s/^| next | |/| r${REVISION} | $(date -u +%F) |/" docs/versions.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/versions.md
            git commit -m "Version history: r${REVISION}" -m 'Made by the Autobuild workflow.'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
